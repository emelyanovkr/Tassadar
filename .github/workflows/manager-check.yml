name: Check management VM

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tassadar-management
  cancel-in-progress: false

jobs:
  check-manager:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      MANAGER_HOST: ${{ vars.MANAGER_HOST }}

    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure verified SSH access
        id: configure
        env:
          MANAGER_SSH_PRIVATE_KEY: ${{ secrets.MANAGER_SSH_PRIVATE_KEY }}
          MANAGER_SSH_KNOWN_HOSTS: ${{ vars.MANAGER_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for required_name in MANAGER_HOST MANAGER_SSH_PRIVATE_KEY MANAGER_SSH_KNOWN_HOSTS; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::$required_name is required"
              exit 1
            fi
          done
          if [[ ! "$MANAGER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]; then
            echo "::error::MANAGER_HOST must be an IPv4 address or DNS name without a user, port, or URL scheme"
            exit 1
          fi

          umask 077
          ssh_directory="$RUNNER_TEMP/tassadar-manager-ssh"
          mkdir -p -- "$ssh_directory"
          printf '%s\n' "$MANAGER_SSH_PRIVATE_KEY" | tr -d '\r' > "$ssh_directory/key"
          printf '%s\n' "$MANAGER_SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_directory/known_hosts"

          # Validate the key without printing it or allowing a passphrase prompt.
          if ! ssh-keygen -y -P '' -f "$ssh_directory/key" > /dev/null 2>&1; then
            echo "::error::MANAGER_SSH_PRIVATE_KEY must contain a valid private key usable without an interactive passphrase"
            exit 1
          fi
          if ! ssh-keygen -F "$MANAGER_HOST" -f "$ssh_directory/known_hosts" > /dev/null; then
            echo "::error::MANAGER_SSH_KNOWN_HOSTS must contain the verified host key for MANAGER_HOST"
            exit 1
          fi

      - name: Check readiness over SSH
        id: readiness
        run: |
          set -euo pipefail
          ssh_directory="$RUNNER_TEMP/tassadar-manager-ssh"
          timeout 420 ssh -F /dev/null -T \
            -i "$ssh_directory/key" \
            -o IdentityAgent=none \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_directory/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ForwardAgent=no \
            -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            "root@$MANAGER_HOST" 'bash -se' < scripts/check-manager.sh

      - name: Report manager readiness
        if: always()
        env:
          CONFIGURATION_OUTCOME: ${{ steps.configure.outcome }}
          READINESS_OUTCOME: ${{ steps.readiness.outcome }}
        run: |
          {
            echo '### Management VM check'
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| SSH configuration | $CONFIGURATION_OUTCOME |"
            echo "| SSH, cloud-init, bootstrap marker, OpenTofu, Ansible, Git | $READINESS_OUTCOME |"
            echo
            if [[ "$READINESS_OUTCOME" == success ]]; then
              echo '**Manager: READY**'
            else
              echo '**Manager: NOT VERIFIED** — inspect the failed step logs.'
            fi
            echo
            echo 'Infrastructure deployment: not requested.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary SSH credentials
        if: always()
        run: |
          ssh_directory="$RUNNER_TEMP/tassadar-manager-ssh"
          if [[ -d "$ssh_directory" ]]; then
            rm -f -- "$ssh_directory/key" "$ssh_directory/known_hosts"
            rmdir -- "$ssh_directory"
          fi
