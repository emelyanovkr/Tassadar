name: Bootstrap management VM

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect the plan or apply it
        type: choice
        options:
          - plan
          - apply
        default: plan
        required: true

permissions:
  contents: read

concurrency:
  group: tassadar-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    # Only the default branch can execute infrastructure code with credentials.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: bootstrap
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_ssh_key_id: ${{ vars.BOOTSTRAP_SSH_KEY_ID }}
      TF_VAR_admin_cidr: ${{ vars.BOOTSTRAP_ADMIN_CIDR || '0.0.0.0/0' }}

    steps:
      - name: Check out Tassadar
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.3
          tofu_wrapper: false

      - name: Require credentials and manager configuration
        run: |
          set -euo pipefail
          for required_name in TF_VAR_digitalocean_token AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY TF_VAR_ssh_key_id; do
            if [[ -z "${!required_name}" ]]; then
              echo "::error::$required_name is required"
              exit 1
            fi
          done

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Initialize bootstrap state
        run: tofu init -input=false -lockfile=readonly

      - name: Validate configuration
        run: tofu validate

      - name: Plan bootstrap
        run: tofu plan -input=false -lock-timeout=5m -out="$RUNNER_TEMP/bootstrap.tfplan"

      - name: Apply bootstrap
        if: inputs.operation == 'apply'
        run: tofu apply -input=false -lock-timeout=5m "$RUNNER_TEMP/bootstrap.tfplan"

      - name: Show manager addresses
        if: inputs.operation == 'apply'
        run: |
          {
            echo '### Management VM'
            echo
            echo "Public IPv4: $(tofu output -raw manager_public_ip)"
            echo "Private IPv4: $(tofu output -raw manager_private_ip)"
            echo
            echo 'VM provisioning finished. Tool installation readiness must be checked over SSH with cloud-init status --wait.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary plan
        if: always()
        run: rm -f -- "$RUNNER_TEMP/bootstrap.tfplan"
