---
- name: Read wsrep health status
  ansible.builtin.command: >
    mysql --user={{ pxc_root_user }}
    --batch --skip-column-names
    --execute="SHOW STATUS WHERE Variable_name IN
    ('wsrep_cluster_size', 'wsrep_cluster_status', 'wsrep_local_state_comment', 'wsrep_connected', 'wsrep_ready');"
  environment:
    MYSQL_PWD: "{{ pxc_root_password }}"
  loop: "{{ groups['pxc'] }}"
  loop_control:
    loop_var: pxc_node
  register: pxc_wsrep_health_status
  changed_when: false
  delegate_to: "{{ pxc_node }}"
  run_once: true
  no_log: true
  tags:
    - verify

- name: Verify healthy 3-node Primary cluster
  ansible.builtin.assert:
    that:
      - "'wsrep_cluster_size\t3' in item.stdout"
      - "'wsrep_cluster_status\tPrimary' in item.stdout"
      - "'wsrep_local_state_comment\tSynced' in item.stdout"
      - "'wsrep_connected\tON' in item.stdout"
      - "'wsrep_ready\tON' in item.stdout"
    fail_msg: "PXC node is not fully synced in a 3-node Primary cluster."
  loop: "{{ pxc_wsrep_health_status.results }}"
  run_once: true
  no_log: true
  tags:
    - verify

- name: Create replication test database
  ansible.builtin.command: >
    mysql --user={{ pxc_root_user }}
    --execute="CREATE DATABASE IF NOT EXISTS percona;"
  environment:
    MYSQL_PWD: "{{ pxc_root_password }}"
  changed_when: false
  delegate_to: pxc-2
  run_once: true
  no_log: true
  tags:
    - verify

- name: Create replication test table
  ansible.builtin.command: >
    mysql --user={{ pxc_root_user }}
    --execute="CREATE TABLE IF NOT EXISTS percona.example (
    node_id INT PRIMARY KEY,
    node_name VARCHAR(30)
    );"
  environment:
    MYSQL_PWD: "{{ pxc_root_password }}"
  changed_when: false
  delegate_to: pxc-3
  run_once: true
  no_log: true
  tags:
    - verify

- name: Reset replication test rows
  ansible.builtin.command: >
    mysql --user={{ pxc_root_user }}
    --execute="DELETE FROM percona.example;"
  environment:
    MYSQL_PWD: "{{ pxc_root_password }}"
  changed_when: false
  delegate_to: pxc-1
  run_once: true
  no_log: true
  tags:
    - verify

- name: Insert one replication test row on each PXC node
  ansible.builtin.command: >
    mysql --user={{ pxc_root_user }}
    --execute="INSERT INTO percona.example (node_id, node_name)
    VALUES ({{ pxc_writer_index + 1 }}, '{{ pxc_writer }}')
    ON DUPLICATE KEY UPDATE node_name = VALUES(node_name);"
  environment:
    MYSQL_PWD: "{{ pxc_root_password }}"
  loop: "{{ groups['pxc'] | sort }}"
  loop_control:
    loop_var: pxc_writer
    index_var: pxc_writer_index
  changed_when: false
  delegate_to: "{{ pxc_writer }}"
  run_once: true
  no_log: true
  tags:
    - verify

- name: Read all replication test rows from each PXC node
  ansible.builtin.command: >
    mysql --user={{ pxc_root_user }}
    --batch --skip-column-names
    --execute="SELECT node_id, node_name FROM percona.example ORDER BY node_id;"
  environment:
    MYSQL_PWD: "{{ pxc_root_password }}"
  loop: "{{ groups['pxc'] | sort }}"
  loop_control:
    loop_var: pxc_reader
  register: pxc_replication_test_reads
  changed_when: false
  until:
    - pxc_replication_test_reads.stdout_lines == ['1\tpxc-1', '2\tpxc-2', '3\tpxc-3']
  retries: 15
  delay: 2
  delegate_to: "{{ pxc_reader }}"
  run_once: true
  no_log: true
  tags:
    - verify

- name: Verify all writes replicated to every PXC node
  ansible.builtin.assert:
    that:
      - item.stdout_lines == ['1\tpxc-1', '2\tpxc-2', '3\tpxc-3']
    fail_msg: "Replication test failed on {{ item.pxc_reader }}."
  loop: "{{ pxc_replication_test_reads.results }}"
  loop_control:
    label: "{{ item.pxc_reader }}"
  run_once: true
  tags:
    - verify
